name: Daily Legal Crawler & Auto Deploy

on:
  schedule:
    # Runs at 00:00 UTC (07:00 AM Vietnam Time) every day
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  crawl-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Automated Legal Crawler
        run: npm run crawl
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Build Application
        run: npm run build

      - name: Commit & Push Changes (if new decrees found)
        run: |
          git config --global user.name "Kiểu Việt Bot"
          git config --global user.email "bot@kieuviet.vn"
          git add public/data/ src/data/
          if ! git diff --cached --quiet; then
            git commit -m "chore(auto-crawl): automatically synced new legal decrees and content [skip ci]"
            git push origin main
          else
            echo "No new decrees found today. Everything is up to date."
          fi

      - name: Deploy to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4